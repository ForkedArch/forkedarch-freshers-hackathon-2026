name: Repository Checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f RULEBOOK.md
          test -f CODE_OF_CONDUCT.md
          test -f CONTRIBUTING.md
          test -f SUBMISSION_TEMPLATE.md

      - name: Check for merge conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)'             --include='*.md' --exclude-dir='.git' .; then
            echo "Conflict markers found."
            exit 1
          fi

      - name: Check for obvious private keys
        run: |
          if grep -RInE             --exclude-dir='.git'             --exclude='*.lock'             '-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----' .; then
            echo "Possible private key detected."
            exit 1
          fi
